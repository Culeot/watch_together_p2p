<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="免费多人同步观赛+屏幕共享，无需注册，打开即用">
    <title>WatchTogether - 多人同步观赛</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- MQTT.js CDN（国内可访问） -->
    <script src="https://cdn.bootcdn.net/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body>
    <!-- ========== 首页 ========== -->
    <div id="home-page">
        <div class="home-container">
            <div class="home-logo">
                <h1>WatchTogether</h1>
                <p>免费 · 免注册 · 多人同步观赛 + 屏幕共享</p>
            </div>
            
            <!-- 创建房间 -->
            <div id="create-section">
                <div class="form-group">
                    <label for="create-nickname">你的昵称</label>
                    <input type="text" id="create-nickname" placeholder="输入昵称" maxlength="20" autocomplete="off">
                </div>
                <button class="btn btn-primary btn-block" id="btn-create-room">创建房间</button>
                
                <!-- 邀请链接（创建后显示） -->
                <div class="invite-link-box" id="invite-box">
                    <div class="link-text" id="invite-link"></div>
                    <button class="btn btn-ghost btn-sm copy-btn" id="btn-copy-link">📋 复制邀请链接</button>
                </div>
            </div>
            
            <div class="home-divider"><span>或</span></div>
            
            <!-- 加入房间 -->
            <div id="join-section">
                <div class="form-group">
                    <label for="join-room-id">房间号</label>
                    <input type="text" id="join-room-id" placeholder="输入6位房间号" maxlength="6" autocomplete="off" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label for="join-nickname">你的昵称</label>
                    <input type="text" id="join-nickname" placeholder="输入昵称" maxlength="20" autocomplete="off">
                </div>
                <button class="btn btn-primary btn-block" id="btn-join-room">加入房间</button>
            </div>
        </div>
    </div>
    
    <!-- ========== 会议室页面 ========== -->
    <div id="room-page">
        <!-- 顶部栏 -->
        <div class="room-header">
            <div class="room-header-left">
                <span class="room-title">WatchTogether</span>
                <span class="room-id-badge" id="room-id-badge" title="点击复制邀请链接">
                    <span id="room-id-display"></span>
                </span>
                <span class="room-member-count" id="member-count"></span>
            </div>
            <div class="room-header-right">
                <div class="connection-status" id="connection-status">
                    <span class="connection-dot connecting" id="conn-dot"></span>
                    <span id="conn-text">连接中...</span>
                </div>
                <button class="btn btn-ghost btn-sm mobile-panel-toggle" id="btn-toggle-panel">👥</button>
                <button class="btn btn-danger btn-sm" id="btn-leave-room">离开</button>
            </div>
        </div>
        
        <!-- 主内容 -->
        <div class="room-main">
            <!-- 主画面区 -->
            <div class="main-view">
                <div class="main-video-container" id="main-video-container">
                    <div class="waiting-screen" id="waiting-screen">
                        <div class="icon">📺</div>
                        <div class="text">等待屏幕共享...</div>
                    </div>
                    <video id="main-video" autoplay playsinline style="display:none;"></video>
                </div>
                <div class="main-view-overlay" id="main-overlay" style="display:none;">
                    <span class="quality-badge live" id="quality-badge">2K 60fps</span>
                </div>
                <!-- 连麦画中画 -->
                <div class="pip-grid" id="pip-grid"></div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="side-panel" id="side-panel">
                <div class="panel-tabs">
                    <div class="panel-tab active" data-tab="members">成员</div>
                    <div class="panel-tab" data-tab="settings">设置</div>
                </div>
                <div class="panel-content">
                    <!-- 成员标签 -->
                    <div class="panel-section" id="tab-members">
                        <div class="panel-section-title">在线成员</div>
                        <div class="member-list" id="member-list"></div>
                    </div>
                    <!-- 设置标签 -->
                    <div class="panel-section" id="tab-settings" style="display:none;">
                        <div class="panel-section-title">共享控制</div>
                        <div id="share-requests-container"></div>
                        <div class="panel-section-title" style="margin-top:16px;">画质设置</div>
                        <div id="quality-control-container"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 控制栏 -->
        <div class="control-bar">
            <button class="control-btn" id="btn-toggle-mic" title="麦克风">
                <span class="btn-icon">🎙️</span>
                <span class="tooltip">开启麦克风</span>
            </button>
            <button class="control-btn" id="btn-toggle-camera" title="摄像头">
                <span class="btn-icon">📷</span>
                <span class="tooltip">开启摄像头</span>
            </button>
            <button class="control-btn screen-share-btn" id="btn-share-screen" title="共享屏幕">
                <span class="btn-icon">🖥️</span>
                <span class="tooltip">共享屏幕</span>
            </button>
            <button class="control-btn" id="btn-stop-share" title="停止共享" style="display:none;">
                <span class="btn-icon">⏹️</span>
                <span class="tooltip">停止共享</span>
            </button>
            <button class="control-btn" id="btn-revoke-share" title="撤销共享" style="display:none;">
                <span class="btn-icon">🚫</span>
                <span class="tooltip">撤销共享</span>
            </button>
        </div>
    </div>
    
    <!-- ========== 弹窗 ========== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>
    
    <!-- ========== Toast 容器 ========== -->
    <div class="toast-container" id="toast-container"></div>
    
    <!-- ========== 加载遮罩 ========== -->
    <div class="loading-overlay" id="loading-overlay" style="display:none;">
        <div class="loading-spinner"></div>
        <div class="text" id="loading-text">处理中...</div>
    </div>
    
    <!-- ========== 房间解散遮罩 ========== -->
    <div class="room-closed-overlay" id="room-closed-overlay" style="display:none;">
        <h2>房间已解散</h2>
        <p id="room-closed-reason">管理员已离开房间</p>
        <button class="btn btn-primary" id="btn-back-home">返回首页</button>
    </div>
    
    <!-- ========== 脚本 ========== -->
    <script src="js/config.js"></script>
    <script src="js/mqtt.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/screenshare.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
